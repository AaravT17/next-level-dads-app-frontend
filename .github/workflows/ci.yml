name: CI

# Runs on every PR, and on main so a merge that breaks the build is caught even
# when the PR itself was green against an older base.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The design-system guard rails in eslint.config.js are set to "error".
      # This step is what gives them force -- without it they are advisory.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
